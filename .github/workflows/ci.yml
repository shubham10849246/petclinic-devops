name: CI - Build, Scan, Push

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.run_number }}
      DOCKER_EXIT_CODE: "NA"

    steps:
      # 1) Checkout
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Java setup
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: maven

      # 3) Build & Test (save logs; keep exit code)
      - name: Build and Test (save logs)
        id: build_test
        shell: bash
        run: |
          set +e
          mvn clean verify 2>&1 | tee maven.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # 4) Sonar (only if build ok)
      - name: SonarCloud Analysis
        if: steps.build_test.outputs.exit_code == '0'
        run: mvn sonar:sonar -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # 5) Deploy Artifact to JFrog (only if build ok)
      - name: Deploy Artifact to JFrog
        if: steps.build_test.outputs.exit_code == '0'
        run: mvn deploy --settings .mvn/settings.xml
        env:
          JFROG_URL: ${{ secrets.JFROG_URL }}
          JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}

      # 6) AWS creds + ECR login (only if build ok)
      - name: Configure AWS Credentials
        if: steps.build_test.outputs.exit_code == '0'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.build_test.outputs.exit_code == '0'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7) Docker build (save logs + store exit code)
      - name: Build Docker image (save logs)
        if: steps.build_test.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          docker build -t ${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} . 2>&1 | tee docker-build.log
          docker_code=${PIPESTATUS[0]}
          echo "DOCKER_EXIT_CODE=$docker_code" >> "$GITHUB_ENV"
          exit 0

      # 8) Trivy scan & policy
      - name: Install Trivy CLI
        if: steps.build_test.outputs.exit_code == '0' && env.DOCKER_EXIT_CODE == '0'
        uses: aquasecurity/setup-trivy@v0.2.2

      - name: Trivy Scan (JSON report)
        if: steps.build_test.outputs.exit_code == '0' && env.DOCKER_EXIT_CODE == '0'
        shell: bash
        run: |
          trivy image \
            --scanners vuln \
            --format json \
            --output trivy-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            ${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Enforce Trivy policy (FAIL only on CRITICAL)
        if: steps.build_test.outputs.exit_code == '0' && env.DOCKER_EXIT_CODE == '0'
        shell: bash
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            ${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      # 9) Tag + Push (only if docker ok)
      - name: Tag Docker image
        if: steps.build_test.outputs.exit_code == '0' && env.DOCKER_EXIT_CODE == '0'
        run: |
          docker tag ${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Push Docker image
        if: steps.build_test.outputs.exit_code == '0' && env.DOCKER_EXIT_CODE == '0'
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      # 10) Ensure files exist + Upload artifacts (always)
      - name: Ensure CI files exist (always)
        if: always()
        shell: bash
        run: |
          [ -f maven.log ] || echo "maven.log missing" > maven.log
          [ -f docker-build.log ] || echo "docker-build.log missing" > docker-build.log
          [ -f trivy-report.json ] || echo "{}" > trivy-report.json

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            maven.log
            docker-build.log
            trivy-report.json

      # 11) Fail CI correctly (at end)
      - name: Fail CI if build/docker failed
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.build_test.outputs.exit_code }}" != "0" ]; then
            echo "Build/Test failed."
            exit 1
          fi
          if [ "${DOCKER_EXIT_CODE}" != "0" ] && [ "${DOCKER_EXIT_CODE}" != "NA" ]; then
            echo "Docker build failed."
            exit 1
          fi
          echo "CI completed successfully."
