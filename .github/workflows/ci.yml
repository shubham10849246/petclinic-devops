name: Java CI
 
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # REQUIRED for Sonar
 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven
 
      - name: Build and Test
        run: mvn clean verify
 
      - name: SonarCloud Analysis
        run: mvn sonar:sonar -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Deploy Artifact to JFrog
        run: mvn deploy --settings .mvn/settings.xml
        env:
          JFROG_URL: ${{ secrets.JFROG_URL }}
          JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
 
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
 
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.ECR_REPOSITORY }}:${{ github.run_number }} .     

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ECR_REPOSITORY }}:${{ github.run_number }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
 
      - name: Tag Docker image
        run: |
          docker tag ${{ secrets.ECR_REPOSITORY }}:${{ github.run_number }} \
          ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.run_number }}
 
      - name: Push Docker image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.run_number }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ secrets.AWS_REGION }}
 
      - name: Deploy to EKS
        run: |
          kubectl set image deployment/petclinic-deployment petclinic=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.run_number }}

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/petclinic --timeout=180s

      - name: Wait for LoadBalancer to be ready
        run: |
          echo "Waiting for LoadBalancer..."
          for i in {1..30}; do
            LB=$(kubectl get svc petclinic -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$LB" ]; then
              echo "LoadBalancer found: $LB"
              echo "APP_URL=http://$LB" >> $GITHUB_ENV
              break
            fi
            echo "Still waiting..."
            sleep 10
          done

          # Fail the step if LB is still empty after retries
          if [ -z "$LB" ]; then
            echo "LoadBalancer not ready after waiting."
            exit 1
          fi

      - name: Smoke Test Homepage
        run: |
          echo "Testing $APP_URL"
          curl -f --retry 5 --retry-delay 5 "$APP_URL"

      - name: Rollback if smoke test fails
        if: failure()
        run: |
          echo "Smoke test failed. Rolling back..."
          kubectl rollout undo deployment/petclinic
          kubectl rollout status deployment/petclinic --timeout=180s
