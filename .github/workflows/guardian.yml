name: Guardian - Collect Logs & Report (Non-Blocking)

on:
  workflow_run:
    workflows:
      - "CI - Build, Scan, Push"
      - "CD - Deploy to EKS"
    types: [completed]

jobs:
  guardian:
    runs-on: ubuntu-latest

    env:
      GUARDIAN_URL: ${{ secrets.GUARDIAN_URL }}
      GUARDIAN_TOKEN: ${{ secrets.GUARDIAN_TOKEN }}

    steps:
      - name: Create metadata for Guardian
        shell: bash
        run: |
          cat <<EOF > metadata.json
          {
            "source": "github-actions",
            "repo": "${{ github.repository }}",
            "workflow": "${{ github.event.workflow_run.name }}",
            "conclusion": "${{ github.event.workflow_run.conclusion }}",
            "event": "${{ github.event.workflow_run.event }}",
            "run_id": "${{ github.event.workflow_run.id }}",
            "run_number": "${{ github.event.workflow_run.run_number }}",
            "run_url": "${{ github.event.workflow_run.html_url }}",
            "branch": "${{ github.event.workflow_run.head_branch }}",
            "commit": "${{ github.event.workflow_run.head_sha }}"
          }
          EOF

      # Download CI artifacts if they exist in THIS triggering run
      - name: Download CI artifacts (if present)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      # Download CD artifacts if they exist in THIS triggering run
      - name: Download CD artifacts (if present)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cd-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Ensure files exist (always)
        if: always()
        shell: bash
        run: |
          [ -f maven.log ] || echo "maven.log missing (CI may not have run)" > maven.log
          [ -f docker-build.log ] || echo "docker-build.log missing (CI may not have run)" > docker-build.log
          [ -f trivy-report.json ] || echo "{}" > trivy-report.json
          [ -f deploy.log ] || echo "deploy.log missing (CD may not have run)" > deploy.log
          [ -f metadata.json ] || echo "{}" > metadata.json

      - name: Send logs to CI/CD Guardian (non-blocking)
        if: always()
        shell: bash
        run: |
          # If GUARDIAN_URL is empty, skip safely
          if [ -z "${GUARDIAN_URL}" ]; then
            echo '{"status":"skipped","reason":"GUARDIAN_URL secret not set"}' > guardian-response.json
            exit 0
          fi

          set +e
          curl -sS --connect-timeout 5 --max-time 20 \
            -X POST "${GUARDIAN_URL}" \
            -H "Authorization: Bearer ${GUARDIAN_TOKEN}" \
            -F "meta=@metadata.json;type=application/json" \
            -F "maven_log=@maven.log;type=text/plain" \
            -F "docker_log=@docker-build.log;type=text/plain" \
            -F "deploy_log=@deploy.log;type=text/plain" \
            -F "trivy_report=@trivy-report.json;type=application/json" \
            -o guardian-response.json

          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "{\"status\":\"error\",\"reason\":\"failed to reach guardian\",\"curl_exit_code\":$rc}" > guardian-response.json
            echo "Guardian not reachable; continuing."
            exit 0
          fi

          echo "Guardian response:"
          cat guardian-response.json
          exit 0

      - name: Publish Guardian Summary to Job Summary
        if: always()
        shell: bash
        run: |
          echo "## CI/CD Guardian Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered workflow:** ${{ github.event.workflow_run.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Conclusion:** ${{ github.event.workflow_run.conclusion }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "```json" >> $GITHUB_STEP_SUMMARY
          cat guardian-response.json >> $GITHUB_STEP_SUMMARY || echo "{}" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY

      - name: Upload Guardian artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-artifacts-${{ github.event.workflow_run.run_number }}-${{ github.event.workflow_run.name }}
          path: |
            metadata.json
            maven.log
            docker-build.log
            deploy.log
            trivy-report.json
            guardian-response.json
