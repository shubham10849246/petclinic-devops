apiVersion: v1
kind: Service
metadata:
  name: petclinic-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
spec:
  type: LoadBalancer
  selector:
    app: petclinic
  ports:
    - name: http
      port: 80
      targetPort: 8080
